<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrid Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v0.45.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v0.45.0/mapbox-gl.css' rel='stylesheet' /> -->
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v1.3.1/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v1.3.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23ff4444"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>') 16 32, crosshair;
        }

        .leaflet-container {
            background: #000 !important;
            cursor: inherit !important;
        }

        .floating-island {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 1000;
            padding: 24px;
            display: none;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            min-width: 200px;
        }

        .floating-island.active {
            display: flex;
        }

        .island-text {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .input-label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ball-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            width: calc(100% - 32px);
            transition: border-color 0.2s;
        }

        .ball-input:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .yes-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: transform 0.1s ease, background 0.2s;
        }

        .yes-btn:hover {
            background: #eee;
        }

        .yes-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="island" class="floating-island">
        <div class="island-text">Simulation Settings</div>
        <div class="input-group">
            <label class="input-label" for="ball-count">Number of Balls</label>
            <input type="number" id="ball-count" class="ball-input" value="1000" min="10" max="5000">
        </div>
        <button id="yes-btn" class="yes-btn">Start Simulation</button>
    </div>

    <script>
        let lastClickedCoord = null;
        let currentMarker = null;
        const island = document.getElementById('island');
        const yesBtn = document.getElementById('yes-btn');
        const ballInput = document.getElementById('ball-count');
        const mapboxToken = "{{ MAPBOX_API }}";

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([40.4168, -3.7038], 13);

        // Mapbox Satellite Tiles
        L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`, {
            maxZoom: 20,
            tileSize: 512,
            zoomOffset: -1
        }).addTo(map);

        map.on('click', function(e) {
            lastClickedCoord = e.latlng;
            island.classList.add('active');
            
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            // More visible pin-like marker
            currentMarker = L.marker(e.latlng).addTo(map);
        });

        yesBtn.addEventListener('click', async () => {
            if (!lastClickedCoord) return;

            const lat = lastClickedCoord.lat;
            const lng = lastClickedCoord.lng;
            const ballCount = ballInput.value;
            
            const originalContent = island.innerHTML;
            island.innerHTML = '<div class="island-text">Preparing Simulation...</div><div style="font-size:11px; margin-top:5px; opacity:0.7">Fetching map data and extracting shapes</div>';
            
            try {
                const response = await fetch('/capture', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ lat, lng, ballCount }),
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    console.log('Game starting...');
                    island.innerHTML = '<div class="island-text">Simulation Started!</div><div style="font-size:11px; margin-top:5px; opacity:0.7">Check the new window</div>';
                    setTimeout(() => {
                        island.classList.remove('active');
                        // Reset island for next time
                        setTimeout(() => {
                            island.innerHTML = originalContent;
                            // Re-bind events if necessary or just use the same DOM structure
                            location.reload(); // Simplest way to reset everything for now
                        }, 500);
                    }, 3000);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error('Failed to start game:', error);
                alert('Request failed. Ensure the backend server is running.');
                island.innerHTML = originalContent;
                // Re-bind event listeners since we innerHTML'd them away
                setupEventListeners();
            }
        });

        function setupEventListeners() {
             // Logic to re-setup if not using location.reload()
        }
    </script>
</body>
</html>
